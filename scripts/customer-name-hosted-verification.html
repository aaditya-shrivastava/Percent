<!doctype html><html><head><title>Percent customer name verification</title></head><body><h1>Customer name verification</h1><button id="read">Read authoritative profile name</button><pre id="result">Ready</pre><script type="module">
import {firebaseAuth} from '/src/backend/firebase.ts';import {supabase} from '/src/backend/client.ts';import {getPercentSessionSnapshot,refreshPercentSession} from '/src/backend/percentSession.ts';
document.querySelector('#read').onclick=async()=>{await firebaseAuth.authStateReady();await refreshPercentSession();const role=await supabase.rpc('get_my_role');if(role.data!=='customer'){document.querySelector('#result').textContent='Real Customer required';return}const session=getPercentSessionSnapshot();const r=await supabase.from('profiles').select('display_name,first_name,last_name').eq('id',session.percentUserId).single();document.querySelector('#result').textContent=JSON.stringify({firebaseDisplayName:firebaseAuth.currentUser?.displayName??null,role:role.data,profile:r.data,error:r.error?.code??null,sessionName:session.user?.displayName,sessionFirstName:session.user?.firstName,sessionLastName:session.user?.lastName},null,2)};
</script></body></html>
