<!doctype html><html><head><title>Percent session diagnosis</title></head><body><h1>Read-only Percent diagnosis</h1><button id="run">Check session and storefront requests</button><pre id="result">Ready</pre><script type="module">
import {firebaseAuth} from '/src/backend/firebase.ts';
import {supabase} from '/src/backend/client.ts';
import {getFirebaseSessionSnapshot} from '/src/backend/firebaseSession.ts';
import {getPercentSessionSnapshot} from '/src/backend/percentSession.ts';
import {loadCatalog} from '/src/backend/catalog.ts';
import {loadStorefrontWebsite} from '/src/backend/website.ts';
const safe=e=>({code:e?.code??null,message:e?.message??String(e),status:e?.status??null});
document.querySelector('#run').onclick=async()=>{const o=document.querySelector('#result');o.textContent='Checking…';await firebaseAuth.authStateReady();const results={firebaseSignedIn:Boolean(firebaseAuth.currentUser),firebaseAnonymous:firebaseAuth.currentUser?.isAnonymous??null,firebaseStatus:getFirebaseSessionSnapshot().status,percent:{loading:getPercentSessionSnapshot().loading,authenticated:getPercentSessionSnapshot().authenticated,role:getPercentSessionSnapshot().role,error:getPercentSessionSnapshot().error},requests:[]};o.textContent=JSON.stringify(results,null,2);await Promise.all([['role',()=>supabase.rpc('get_my_role')],['content',()=>supabase.rpc('get_storefront_content')],['products',()=>supabase.from('products').select('id').eq('is_visible',true)],['catalog',()=>loadCatalog()],['website',()=>loadStorefrontWebsite()]].map(async([name,fn])=>{try{const r=await fn();results.requests.push({name,error:r?.error?safe(r.error):null,status:r?.status??null,role:name==='role'?r.data:undefined,count:name==='products'?r.data?.length:undefined});}catch(e){results.requests.push({name,error:safe(e)})}o.textContent=JSON.stringify(results,null,2)}));};
</script></body></html>
<button id="deny">Check valid WOFF2 upload, creation and enable denial</button><pre id="denial">Ready</pre><script type="module">
import {supabase} from '/src/backend/client.ts';
document.querySelector('#deny').onclick=async()=>{const output=document.querySelector('#denial');output.textContent='Checking…';const role=await supabase.rpc('get_my_role');if(role.error||role.data!=='customer'){output.textContent='FAIL: real Customer required';return}const results=[];const font=await (await fetch('/fonts/builtin/lora/lora-latin-wght-normal.woff2')).blob();const form=new FormData();form.set('action','font_save');form.set('family_name','Percent Hosted Font Test');form.set('enabled','true');form.set('license_confirmed','true');form.set('faces',JSON.stringify([{file_key:'file_0',weight:400,style:'normal'}]));form.set('file_0',font,'legal-lora.woff2');for(const [name,body] of [['valid WOFF2 create/upload',form],['enable',{action:'font_toggle',family_id:'e1df4f06-28c2-4455-a518-a0d99187f485',enabled:true,expected_updated_at:'2026-01-01T00:00:00Z'}]]){const r=await supabase.functions.invoke('percent-website-media',{body});const response=r.error?.context??r.response;const data=await response?.clone().json();results.push({name,status:response?.status,error:data?.error,denied:response?.status===403,privateMetadataDetected:/storage_path|sha256|cleanup_paths|service_role|fonts\//.test(JSON.stringify(data))})}const c=await supabase.rpc('get_storefront_content');results.push({name:'original typography and public catalog',status:c.status,typography:c.data?.settings?.typography,fontFamilies:c.data?.font_families?.length});output.textContent=JSON.stringify({role:role.data,results},null,2)};
</script>
